<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatApp — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style/login.css" />
</head>
<body>

  <div class="bg-grid"></div>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>

  <div class="container">

    <div class="brand">
      <div class="brand-icon">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
          <path d="M4 6C4 4.895 4.895 4 6 4H22C23.105 4 24 4.895 24 6V18C24 19.105 23.105 20 22 20H15L9 24V20H6C4.895 20 4 19.105 4 18V6Z" fill="currentColor"/>
        </svg>
      </div>
      <span class="brand-name">Verd<em>Chat</em></span>
    </div>

    <div class="card">
      <div class="card-header">
        <h1>Welcome back</h1>
        <p>Sign in to continue your conversations</p>
      </div>

      <form class="form" id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
            </svg>
            <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required />
          </div>
        </div>

        <div class="field">
          <label for="password">
            Password
            <a href="#" class="forgot">Forgot?</a>
          </label>
          <div class="input-wrap">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required />
            <button type="button" class="toggle-pw" id="togglePw" aria-label="Toggle password">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>

          </div>
          <div id="invalid-message" style="display: none; color: red; ">
          Invalid credentials. Please try again.
          </div>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span class="btn-text">Sign In</span>
          <span class="btn-arrow">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </span>
        </button>
      </form>

      <div class="divider"><span>or</span></div>

      <p class="signup-link">Don't have an account? <a href="/register">Create one</a></p>
    </div>

    <p class="footer-note">Encrypted end-to-end · Your data stays yours</p>

  </div>

  <script>
    // Toggle password visibility
    const togglePw = document.getElementById('togglePw');
    const pwInput = document.getElementById('password');
    togglePw.addEventListener('click', () => {
      const isText = pwInput.type === 'text';
      pwInput.type = isText ? 'password' : 'text';
      togglePw.classList.toggle('active', !isText);
    });

    // Submit loading state
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('submitBtn');
    form.addEventListener('submit', async(e) => {
      e.preventDefault();
      btn.classList.add('loading');

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ email, password }),
        });
      
      data = await res.json();
      if(!res.ok){
        invalidmessage = document.getElementById('invalid-message');
        invalidmessage.style.display = 'block'; 
      }
      else{
        window.location.href="/";
      }
     }
        catch(err){
          console.log(err);
        }
      
    });



    // Input focus ripple
    document.querySelectorAll('.input-wrap input').forEach(input => {
      input.addEventListener('focus', () => input.closest('.input-wrap').classList.add('focused'));
      input.addEventListener('blur', () => input.closest('.input-wrap').classList.remove('focused'));
    });
  </script>
</body>
</html>
